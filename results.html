<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Results | Kaha Chalen?</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
 
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="nav-logo">Kaha Chalen?</div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="quiz.html" class="nav-link">Quiz</a>
        <a href="results.html" class="nav-link active">Results</a>
        <a href="login.html" class="nav-link" id="auth-link">Login</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark or light mode">☀️</button>
      </nav>
    </header>
 
    <!-- RESULTS HEADER -->
    <div class="results-header">
      <p class="results-subtitle">Based on your mood, here's where you should go —</p>
      <h1 class="results-title">Your Perfect Spots ✨</h1>
      <div class="tag-pills" id="tag-pills"></div>
    </div>
 
    <!-- RESULTS GRID -->
    <div class="results-grid" id="results-grid"></div>

    <!-- USER SUGGESTIONS -->
    <div class="map-section" id="suggested-wrapper" style="display:none;">
      <p class="map-section-title">✨ Community suggested spots</p>
      <ul id="suggested-list"></ul>
    </div>
 
    <!-- MAP -->
    <div class="map-section">
      <p class="map-section-title">📍 On the map</p>
      <div id="results-map"></div>
    </div>
 
    <!-- ACTIONS -->
    <div class="actions-row">
      <a href="quiz.html" class="primary-btn secondary">← Retake Quiz</a>
      <a href="index.html" class="primary-btn outline">Back to Home</a>
    </div>
 
    <!-- FOOTER -->
    <footer class="footer">© 2025 Kaha Chalen? • Built using HTML, CSS & JavaScript</footer>
 
    <!-- SCRIPTS -->
    <script src="auth.js"></script>
    <script src="navbar.js"></script>
    <script src="theme.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="places.js"></script>
    <script src="map.js"></script>
 
    <script>
      // ── Read quiz results from localStorage ──
      const savedTags = JSON.parse(localStorage.getItem("quizTags")) || [];
      const grid = document.getElementById("results-grid");
      const pillsContainer = document.getElementById("tag-pills");
      const suggestedWrapper = document.getElementById("suggested-wrapper");
      const suggestedList = document.getElementById("suggested-list");
 
      // Show the tags the user picked as pills (if any)
      const uniqueTags = [...new Set(savedTags.flat())];
      if (uniqueTags.length) {
        uniqueTags.forEach(tag => {
          const pill = document.createElement("span");
          pill.className = "tag-pill";
          pill.textContent = tag;
          pillsContainer.appendChild(pill);
        });
      }

      // Filter places by matching tags (quiz logic unchanged)
      const matched = uniqueTags.length
        ? places.filter(p =>
            p.tags && p.tags.some(tag => uniqueTags.includes(tag))
          )
        : [];
 
      // ── Render cards ──
      if (!uniqueTags.length) {
        grid.innerHTML = `
          <div class="no-results" style="grid-column: 1/-1">
            <div class="no-results-icon">🧭</div>
            <h3>No quiz answers found</h3>
            <p>Take the quiz so we can match places to your mood.</p>
            <p style="margin-top:0.75rem;">
              <a href="quiz.html" class="primary-btn secondary">Start the quiz →</a>
            </p>
          </div>`;
      } else if (matched.length === 0) {
        grid.innerHTML = `
          <div class="no-results" style="grid-column: 1/-1">
            <div class="no-results-icon">🗺️</div>
            <h3>No exact matches found</h3>
            <p>Try retaking the quiz with different answers — or check back as more places get added!</p>
          </div>`;
      } else {
        matched.forEach(place => {
          const card = document.createElement("div");
          card.className = "place-card";
 
          // Build tag pills for this place
          const tagHTML = (place.tags || [])
            .map(t => `<span class="place-tag">${t}</span>`)
            .join("");
 
          card.innerHTML = `
            <div class="place-img-wrap">
              <img src="${place.image}" alt="${place.name}"
                   onerror="this.src='https://placehold.co/400x200/0b1120/60a5fa?text=${encodeURIComponent(place.name)}'"/>
              <span class="place-category-badge">${place.category}</span>
            </div>
            <div class="place-body">
              <div class="place-name">${place.name}</div>
              <div class="place-tags">${tagHTML}</div>
            </div>`;
 
          grid.appendChild(card);
        });
      }
 
      // ── Load community suggested places ──
      const suggestedPlaces = JSON.parse(localStorage.getItem("suggestedPlaces")) || [];
      if (suggestedPlaces.length && suggestedWrapper && suggestedList) {
        suggestedWrapper.style.display = "block";
        suggestedPlaces.forEach(place => {
          const li = document.createElement("li");
          li.textContent = `${place.name} – ${place.area} (${place.category})`;
          suggestedList.appendChild(li);
        });
      }

      // ── Init map and drop markers ──
      (function initResultsMap() {
        const mapEl = document.getElementById("results-map");
        if (!mapEl) return;
 
        const map = L.map("results-map").setView([23.1815, 79.9864], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);
 
        const list = matched.length ? matched : places;
        list.forEach(place => {
          if (!place.lat || !place.lng) return;
          L.marker([place.lat, place.lng])
            .addTo(map)
            .bindPopup(`<strong>${place.name}</strong><br>${place.category}`);
        });
      })();
    </script>
  </body>
</html>
